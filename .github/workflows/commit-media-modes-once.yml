name: Commit media modes once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/commit-media-modes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Patch index
        run: python .github/scripts/patch_media_modes.py

      - name: Verify
        run: |
          grep -q 'id="questionVideoBox"' index.html
          grep -q 'id="revealImageBtn"' index.html
          grep -q 'Uložit body → zpět na tabuli' index.html
          ! grep -q 'id="sourceBtn"' index.html
          ! grep -q 'id="allCorrect"' index.html
          ! grep -q 'id="finishNoScore"' index.html
          ! grep -q 'id="reopenLater"' index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add question and reveal media modes"
          git push
