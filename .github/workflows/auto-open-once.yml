name: Patch Riskuj auto-open

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auto-open-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''function openContentView(raw,label="Obsah"){
            const url=normalizeContentUrl(raw);
            if(!url){toast("Odkaz není platná webová adresa");return}
            activeContentUrl=url;
            stopTimer();
            $("contentTitle").textContent=label;
            $("contentUrl").textContent=url;
            $("contentFrame").src=url;
            $("contentOverlay").classList.add("show");
          }
'''
          new='''function canEmbedContent(url){
            try{
              const host=new URL(url).hostname.toLowerCase().replace(/^www\\./,"");
              return host==="wikipedia.org" || host.endsWith(".wikipedia.org") ||
                     host==="wikimedia.org" || host.endsWith(".wikimedia.org") ||
                     host==="youtube-nocookie.com" || host.endsWith(".youtube-nocookie.com");
            }catch(e){return false}
          }
          function openExternalContent(url){
            const w=window.open(url,"_blank","noopener,noreferrer");
            if(!w) window.location.href=url;
          }
          function openContentView(raw,label="Obsah"){
            const url=normalizeContentUrl(raw);
            if(!url){toast("Odkaz není platná webová adresa");return}
            stopTimer();
            if(!canEmbedContent(url)){
              openExternalContent(url);
              return;
            }
            activeContentUrl=url;
            $("contentTitle").textContent=label;
            $("contentUrl").textContent=url;
            $("contentFrame").src=url;
            $("contentOverlay").classList.add("show");
          }
'''
          if old not in s:
              raise SystemExit('Target block not found; refusing to patch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          grep -q 'function canEmbedContent' index.html
          grep -q 'function openExternalContent' index.html
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open blocked source links automatically" || exit 0
          git push
