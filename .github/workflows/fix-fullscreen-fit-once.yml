name: Fix Riskuj viewport fit once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-fullscreen-fit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch viewport fit
        run: python3 .github/scripts/fix_fullscreen_fit.py

      - name: Verify viewport fit
        run: |
          grep -Fq 'height:100dvh' index.html
          grep -Fq 'b.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`' index.html
          grep -Fq 'b.style.gridTemplateRows=`minmax(38px,.72fr) repeat(${rows},minmax(0,1fr))`' index.html
          grep -Fq '.board-wrap{flex:1 1 auto;min-height:0;overflow:hidden' index.html

      - name: Remove one-time files and commit
        run: |
          rm -f .github/workflows/fix-fullscreen-fit-once.yml
          rm -f .github/scripts/fix_fullscreen_fit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fit Riskuj board to viewport"
          git push
