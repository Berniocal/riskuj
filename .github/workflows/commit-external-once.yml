name: Commit external link behavior

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/commit-external-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch index
        run: python .github/scripts/patch_auto_open.py

      - name: Verify
        run: grep -q 'window.open(url,"riskuj-content","width=1100,height=800")' index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Open source links externally like Skladani slov"
          git push
